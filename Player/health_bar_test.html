<!DOCTYPE html>
<html>

<head>
    <title>Ultimate Health Bar Lab</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: white;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        canvas {
            border: 2px solid #333;
            background: #000;
            image-rendering: pixelated;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .controls {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            width: 320px;
            border: 1px solid #444;
            max-height: 95vh;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: #aaa;
            font-size: 12px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .value {
            float: right;
            color: #ff1744;
            font-weight: bold;
        }

        h2 {
            margin: 0 0 12px 0;
            color: #eee;
            border-bottom: 2px solid #ff1744;
            padding-bottom: 4px;
            font-size: 16px;
        }

        .divider {
            height: 1px;
            background: #444;
            margin: 12px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ff1744;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        button:hover {
            background: #d50000;
        }

        button.active {
            background: #444;
        }

        button.secondary {
            background: #333;
            border: 1px solid #555;
        }

        button.secondary:hover {
            background: #444;
        }

        #apply-status {
            font-size: 11px;
            color: #888;
            margin: 0 0 10px 0;
            line-height: 1.35;
        }
    </style>
</head>

<body>
    <div class="container">
        <div>
            <h2>Render Preview</h2>
            <canvas id="cvs" width="450" height="950"></canvas>
        </div>

        <div class="controls">
            <h2>Playback</h2>
            <button id="anim-btn">Play Drain Animation</button>

            <p id="apply-status"></p>
            <button type="button" class="secondary" id="apply-btn">Apply — save to GUI/health_hud_config.json</button>

            <h2>General</h2>
            <div class="control-group">
                <label>Entity Health <span id="hp-val" class="value">20.0</span></label>
                <input type="range" id="hp-range" min="0" max="20" step="0.1" value="20">
            </div>

            <div class="control-group">
                <label>Number of Hearts <span id="count-val" class="value">7</span></label>
                <input type="range" id="count-range" min="1" max="20" step="1" value="7">
            </div>

            <div class="divider"></div>

            <h2>Frame Controls</h2>
            <div class="control-group">
                <label>Frame Width <span id="fw-val" class="value">120</span></label>
                <input type="range" id="fw-range" min="20" max="300" step="1" value="120">
            </div>

            <div class="control-group">
                <label>Frame Height <span id="fh-val" class="value">379</span></label>
                <input type="range" id="fh-range" min="50" max="700" step="1" value="379">
            </div>

            <div class="control-group">
                <label>Frame Y-Shift <span id="fshift-val" class="value">0.00</span></label>
                <input type="range" id="fshift-range" min="-0.5" max="0.5" step="0.01" value="0.00">
            </div>

            <div class="divider"></div>

            <h2>Frame UV Controls</h2>
            <div class="control-group">
                <label>Frame U1 <span id="fu1-val" class="value">0.094</span></label>
                <input type="range" id="fu1-range" min="0" max="0.3" step="0.001" value="0.094">
            </div>

            <div class="control-group">
                <label>Frame V1 <span id="fv1-val" class="value">0.039</span></label>
                <input type="range" id="fv1-range" min="0" max="0.3" step="0.001" value="0.039">
            </div>

            <div class="control-group">
                <label>Frame U2 <span id="fu2-val" class="value">0.510</span></label>
                <input type="range" id="fu2-range" min="0.3" max="0.7" step="0.001" value="0.510">
            </div>

            <div class="control-group">
                <label>Frame V2 <span id="fv2-val" class="value">0.920</span></label>
                <input type="range" id="fv2-range" min="0.6" max="1.0" step="0.001" value="0.920">
            </div>

            <div class="divider"></div>

            <h2>Heart Column Controls</h2>
            <div class="control-group">
                <label>Heart Width <span id="hw-val" class="value">52</span></label>
                <input type="range" id="hw-range" min="5" max="200" step="1" value="52">
            </div>

            <div class="control-group">
                <label>Heart Height <span id="hh-val" class="value">30</span></label>
                <input type="range" id="hh-range" min="5" max="200" step="1" value="30">
            </div>

            <div class="control-group">
                <label>Heart Spacing Ratio <span id="hspacing-val" class="value">0.079</span></label>
                <input type="range" id="hspacing-range" min="0.01" max="0.4" step="0.001" value="0.079">
            </div>

            <div class="control-group">
                <label>Heart X-Offset <span id="hxoffset-val" class="value">0.020</span></label>
                <input type="range" id="hxoffset-range" min="-0.5" max="0.5" step="0.001" value="0.020">
            </div>

            <div class="control-group">
                <label>Heart Y-Start <span id="hystart-val" class="value">0.212</span></label>
                <input type="range" id="hystart-range" min="-0.2" max="0.4" step="0.001" value="0.212">
            </div>

            <div class="divider"></div>

            <h2>In-game (ESP) sync</h2>
            <div class="control-group">
                <label>Animation FPS <span id="animfps-val" class="value">10</span></label>
                <input type="range" id="animfps-range" min="1" max="30" step="1" value="10">
            </div>
            <div class="control-group">
                <label>Billboard scale <span id="billboard-val" class="value">0.003166</span></label>
                <input type="range" id="billboard-range" min="0.0005" max="0.012" step="0.000001" value="0.003166">
            </div>
            <div class="control-group">
                <label>Side offset <span id="sideoffset-val" class="value">0.35</span></label>
                <input type="range" id="sideoffset-range" min="0" max="1.5" step="0.01" value="0.35">
            </div>
            <div class="control-group">
                <label>Layer nudge <span id="layernudge-val" class="value">0.0025</span></label>
                <input type="range" id="layernudge-range" min="-0.02" max="0.02" step="0.0001" value="0.0025">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        const img = new Image();
        img.src = 'GUI/health_bar.png';

        const animFramePaths = [
            'GUI/sprites/frame_R1_C1.png',
            'GUI/sprites/frame_R1_C2.png',
            'GUI/sprites/frame_R1_C3.png',
            'GUI/sprites/frame_R2_C1.png',
            'GUI/sprites/frame_R2_C2.png',
            'GUI/sprites/frame_R2_C3.png'
        ];

        const animFrames = animFramePaths.map(path => {
            const image = new Image();
            image.src = path;
            return image;
        });
        let animFps = 10;

        const heartSuffixes = ['top', 'mid', 'bot'];
        const frameRcKeys = [
            [1, 1], [1, 2], [1, 3],
            [2, 1], [2, 2], [2, 3]
        ];
        const heartSprites = frameRcKeys.map(([r, c]) =>
            heartSuffixes.map(suffix => {
                const image = new Image();
                image.src = `GUI/sprites/heart_R${r}_C${c}_${suffix}.png`;
                return image;
            })
        );

        const controls = {
            hp: document.getElementById('hp-range'),
            count: document.getElementById('count-range'),

            fw: document.getElementById('fw-range'),
            fh: document.getElementById('fh-range'),
            fshift: document.getElementById('fshift-range'),

            fu1: document.getElementById('fu1-range'),
            fv1: document.getElementById('fv1-range'),
            fu2: document.getElementById('fu2-range'),
            fv2: document.getElementById('fv2-range'),

            hw: document.getElementById('hw-range'),
            hh: document.getElementById('hh-range'),
            hspacing: document.getElementById('hspacing-range'),
            hxoffset: document.getElementById('hxoffset-range'),
            hystart: document.getElementById('hystart-range')
        };

        const animBtn = document.getElementById('anim-btn');
        const applyBtn = document.getElementById('apply-btn');
        const applyStatus = document.getElementById('apply-status');

        const espControls = {
            animfps: document.getElementById('animfps-range'),
            billboard: document.getElementById('billboard-range'),
            sideoffset: document.getElementById('sideoffset-range'),
            layernudge: document.getElementById('layernudge-range')
        };

        function setApplyStatus(msg) {
            applyStatus.textContent = msg || '';
        }

        function collectConfig() {
            return {
                fw: parseInt(controls.fw.value, 10),
                fh: parseInt(controls.fh.value, 10),
                fshift: parseFloat(controls.fshift.value),
                fu1: parseFloat(controls.fu1.value),
                fv1: parseFloat(controls.fv1.value),
                fu2: parseFloat(controls.fu2.value),
                fv2: parseFloat(controls.fv2.value),
                heartCount: parseInt(controls.count.value, 10),
                hw: parseInt(controls.hw.value, 10),
                hh: parseInt(controls.hh.value, 10),
                hspacing: parseFloat(controls.hspacing.value),
                hxoffset: parseFloat(controls.hxoffset.value),
                hystart: parseFloat(controls.hystart.value),
                animFps: parseFloat(espControls.animfps.value),
                billboardScale: parseFloat(espControls.billboard.value),
                sideOffset: parseFloat(espControls.sideoffset.value),
                layerNudge: parseFloat(espControls.layernudge.value)
            };
        }

        function applyConfig(cfg) {
            if (!cfg || typeof cfg !== 'object') return;
            if (cfg.fw != null) controls.fw.value = cfg.fw;
            if (cfg.fh != null) controls.fh.value = cfg.fh;
            if (cfg.fshift != null) controls.fshift.value = cfg.fshift;
            if (cfg.fu1 != null) controls.fu1.value = cfg.fu1;
            if (cfg.fv1 != null) controls.fv1.value = cfg.fv1;
            if (cfg.fu2 != null) controls.fu2.value = cfg.fu2;
            if (cfg.fv2 != null) controls.fv2.value = cfg.fv2;
            if (cfg.heartCount != null) controls.count.value = cfg.heartCount;
            if (cfg.hw != null) controls.hw.value = cfg.hw;
            if (cfg.hh != null) controls.hh.value = cfg.hh;
            if (cfg.hspacing != null) controls.hspacing.value = cfg.hspacing;
            if (cfg.hxoffset != null) controls.hxoffset.value = cfg.hxoffset;
            if (cfg.hystart != null) controls.hystart.value = cfg.hystart;
            if (cfg.animFps != null) {
                espControls.animfps.value = cfg.animFps;
                animFps = cfg.animFps;
            }
            if (cfg.billboardScale != null) espControls.billboard.value = cfg.billboardScale;
            if (cfg.sideOffset != null) espControls.sideoffset.value = cfg.sideOffset;
            if (cfg.layerNudge != null) espControls.layernudge.value = cfg.layerNudge;
        }

        async function saveConfigToProject() {
            const cfg = collectConfig();
            try {
                localStorage.setItem('healthHudConfig', JSON.stringify(cfg));
            } catch (e) {
                /* ignore */
            }
            const text = JSON.stringify(cfg, null, 2);
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'health_hud_config.json',
                        types: [{
                            description: 'JSON',
                            accept: { 'application/json': ['.json'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(text);
                    await writable.close();
                    setApplyStatus('Saved. Choose your project file GUI/health_hud_config.json so the ESP picks it up on the next frame.');
                    return;
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                }
            }
            const blob = new Blob([text], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'health_hud_config.json';
            a.click();
            URL.revokeObjectURL(a.href);
            setApplyStatus('Downloaded health_hud_config.json — copy it to Player/GUI/health_hud_config.json (overwrite).');
        }

        async function loadConfigOnStart() {
            try {
                const res = await fetch('GUI/health_hud_config.json', { cache: 'no-store' });
                if (res.ok) {
                    applyConfig(await res.json());
                    return;
                }
            } catch (e) {
                /* file:// or missing */
            }
            try {
                const raw = localStorage.getItem('healthHudConfig');
                if (raw) applyConfig(JSON.parse(raw));
            } catch (e) {
                /* ignore */
            }
            animFps = parseFloat(espControls.animfps.value);
        }

        applyBtn.addEventListener('click', () => {
            saveConfigToProject();
        });

        let isAnimating = false;
        let animDir = -1;
        let lastTime = 0;
        let frameTime = 0;
        let frameIndex = 0;

        animBtn.onclick = () => {
            isAnimating = !isAnimating;
            if (isAnimating) {
                frameTime = 0;
                frameIndex = 0;
            }
            animBtn.innerText = isAnimating ? 'Stop Animation' : 'Play Drain Animation';
            animBtn.classList.toggle('active', isAnimating);
        };

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function drawTexturedRectUV(u1, v1, u2, v2, dx, dy, dw, dh) {
            if (!img.complete || img.width <= 0 || img.height <= 0) return;

            // Keep sampling slightly inside the UV bounds to avoid atlas bleeding.
            const insetX = 0.5;
            const insetY = 0.5;
            const sx1 = (img.width * u1) + insetX;
            const sy1 = (img.height * v1) + insetY;
            const sx2 = (img.width * u2) - insetX;
            const sy2 = (img.height * v2) - insetY;
            const sx = sx1;
            const sy = sy1;
            const sw = sx2 - sx1;
            const sh = sy2 - sy1;

            if (sw <= 0 || sh <= 0 || dw <= 0 || dh <= 0) return;

            ctx.drawImage(
                img,
                sx,
                sy,
                sw,
                sh,
                dx,
                dy,
                dw,
                dh
            );
        }

        function drawSeparatedAnimatedFrame(frameCanvas, frameX, frameY, frameW, frameH) {
            ctx.drawImage(frameCanvas, frameX, frameY, frameW, frameH);
        }

        function heartVariantIndex(damageAmount) {
            if (damageAmount <= 0.0) return 0;
            if (damageAmount < 1.0) return 1;
            return 2;
        }

        function drawHeartSprite(heartImg, x, y, w, h) {
            if (!heartImg || !heartImg.complete || heartImg.width <= 0) return;
            ctx.drawImage(heartImg, x, y, w, h);
        }

        function drawHeartDiscrete(x, y, w, h, damageAmount) {
            damageAmount = clamp(damageAmount, 0, 1);

            const heartU1 = 0.62;
            const heartU2 = 0.92;

            let v1;
            let v2;

            if (damageAmount <= 0.0) {
                // Full red
                v1 = 0.23;
                v2 = 0.38;
            } else if (damageAmount < 1.0) {
                // Damaged / broken
                v1 = 0.40;
                v2 = 0.55;
            } else {
                // Stone
                v1 = 0.57;
                v2 = 0.72;
            }

            drawTexturedRectUV(
                heartU1,
                v1,
                heartU2,
                v2,
                x,
                y,
                w,
                h
            );
        }

        function setLabel(id, value) {
            document.getElementById(id).innerText = value;
        }

        let displayedHp = 20;

        function update(timestamp) {
            if (!lastTime) {
                lastTime = timestamp;
            }
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            const targetHp = parseFloat(controls.hp.value);

            if (isAnimating) {
                let currentHp = targetHp;
                currentHp += animDir * dt * 4.0;

                if (currentHp <= 0) {
                    currentHp = 0;
                    animDir = 1;
                }

                if (currentHp >= 20) {
                    currentHp = 20;
                    animDir = -1;
                }

                controls.hp.value = currentHp;
            }

            const hpChanged = Math.abs(displayedHp - parseFloat(controls.hp.value)) > 0.01;
            if (hpChanged) {
                displayedHp += (parseFloat(controls.hp.value) - displayedHp) * 5.0 * dt;
            } else {
                displayedHp = parseFloat(controls.hp.value);
            }

            // Continuous animation
            frameTime += dt;
            frameIndex = Math.floor(frameTime * animFps) % animFrames.length;

            const totalHearts = parseInt(controls.count.value);

            const fw = parseInt(controls.fw.value);
            const fh = parseInt(controls.fh.value);
            const fshift = parseFloat(controls.fshift.value);

            const fu1 = parseFloat(controls.fu1.value);
            const fv1 = parseFloat(controls.fv1.value);
            const fu2 = parseFloat(controls.fu2.value);
            const fv2 = parseFloat(controls.fv2.value);

            const hw = parseInt(controls.hw.value);
            const hh = parseInt(controls.hh.value);
            const hspacing = parseFloat(controls.hspacing.value);
            const hxoffset = parseFloat(controls.hxoffset.value);
            const hystart = parseFloat(controls.hystart.value);

            setLabel('hp-val', targetHp.toFixed(1));
            setLabel('count-val', totalHearts);

            setLabel('fw-val', fw);
            setLabel('fh-val', fh);
            setLabel('fshift-val', fshift.toFixed(2));

            setLabel('fu1-val', fu1.toFixed(3));
            setLabel('fv1-val', fv1.toFixed(3));
            setLabel('fu2-val', fu2.toFixed(3));
            setLabel('fv2-val', fv2.toFixed(3));

            setLabel('hw-val', hw);
            setLabel('hh-val', hh);
            setLabel('hspacing-val', hspacing.toFixed(3));
            setLabel('hxoffset-val', hxoffset.toFixed(3));
            setLabel('hystart-val', hystart.toFixed(3));

            const af = parseFloat(espControls.animfps.value);
            animFps = af > 0 ? af : 10;
            setLabel('animfps-val', String(Math.round(animFps)));
            setLabel('billboard-val', parseFloat(espControls.billboard.value).toFixed(6));
            setLabel('sideoffset-val', parseFloat(espControls.sideoffset.value).toFixed(2));
            setLabel('layernudge-val', parseFloat(espControls.layernudge.value).toFixed(4));

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const idleFrame = animFrames[0];
            const hasIdleFrame = idleFrame && idleFrame.complete && idleFrame.width > 0;
            const canUseLegacyAtlas = img.complete && img.width > 0 && img.height > 0;
            if (!hasIdleFrame && !canUseLegacyAtlas) {
                requestAnimationFrame(update);
                return;
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const frameX = centerX - fw / 2;
            const frameBaseY = centerY - fh / 2 + (fshift * fh);

            const maxHp = 20.0;
            const health = clamp(displayedHp, 0.0, maxHp);
            const damage = maxHp - health;
            const hpPerHeart = maxHp / totalHearts;

            const heartX = centerX - hw / 2 + (hxoffset * fw);
            const startY = frameBaseY + (fh * hystart);
            const heartStep = fh * hspacing;

            const hasAnimFrame = animFrames[frameIndex] && animFrames[frameIndex].complete && animFrames[frameIndex].width > 0;
            const activeFrameIdx = frameIndex;
            const activeFrame = animFrames[activeFrameIdx];
            const hasActiveFrame = activeFrame && activeFrame.complete && activeFrame.width > 0;

            if (hasActiveFrame) {
                drawSeparatedAnimatedFrame(
                    activeFrame,
                    frameX,
                    frameBaseY,
                    fw,
                    fh
                );
            } else if (canUseLegacyAtlas) {
                drawTexturedRectUV(
                    fu1,
                    fv1,
                    fu2,
                    fv2,
                    frameX,
                    frameBaseY,
                    fw,
                    fh
                );
            }

            for (let i = 0; i < totalHearts; i++) {
                // In HTML, i = 0 is the top heart.
                // Damage starts at the top and moves downward.
                const heartDamageStart = i * hpPerHeart;
                const damageAmount = (damage - heartDamageStart) / hpPerHeart;

                const hY = startY + (i * heartStep);

                const tier = heartVariantIndex(damageAmount);
                const spriteSet = heartSprites[activeFrameIdx];
                const sprite = spriteSet ? spriteSet[tier] : null;

                if (sprite && sprite.complete && sprite.width > 0) {
                    drawHeartSprite(sprite, heartX, hY, hw, hh);
                } else if (canUseLegacyAtlas) {
                    drawHeartDiscrete(
                        heartX,
                        hY,
                        hw,
                        hh,
                        damageAmount
                    );
                }
            }

            requestAnimationFrame(update);
        }

        Object.values(controls).forEach(c => {
            c.oninput = () => {
                // isAnimating = false;
                // frameTime = 0;
                // frameIndex = 0;
                // animBtn.innerText = 'Play Drain Animation';
                // animBtn.classList.remove('active');
            };
        });
        Object.values(espControls).forEach(c => {
            c.oninput = () => {
                // isAnimating = false;
                // frameTime = 0;
                // frameIndex = 0;
                // animBtn.innerText = 'Play Drain Animation';
                // animBtn.classList.remove('active');
            };
        });

        img.onload = async () => {
            await loadConfigOnStart();
            requestAnimationFrame(update);
        };
    </script>
</body>

</html>
